[workspace]
resolver = "3"
members = [
    "crates/dodb-core",
    "crates/dodb-storage",
    "crates/dodb-testkit",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
crc32c = "0.6"
proptest = "1.6"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
