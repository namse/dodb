[workspace]
resolver = "3"
members = [
    "crates/dodb-core",
    "crates/dodb-service",
    "crates/dodb-protocol",
    "crates/dodb-client",
    "crates/dodb-server",
    "crates/dodb-storage",
    "crates/dodb-testkit",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
crc32c = "0.6"
quinn = "0.11.11"
proptest = "1.6"
rustls-pemfile = "2.2"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
